display:flex;justify-content:space-between;color:#aaa;font-size:12px}.lightbox{position:fixed;inset:0;background:#080808f5;z-index:100;display:none;align-items:center;justify-content:center;padding:65px 55px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain}.lightbox button{position:absolute;background:#202020;color:white;border:1px solid #555;padding:12px 17px;cursor:pointer;font-size:20px}.close{top:20px;right:24px}.prev{left:12px}.next{right:12px}.count{position:absolute;bottom:20px;font-size:12px;color:#aaa;letter-spacing:.15em}@media(max-width:850px){header{height:72px}nav{gap:12px;font-size:10px}.brand span{display:none}.gallery{columns:2}.intro{padding:70px 6% 45px}.gallery{padding:0 6% 70px}.filters{padding-left:6%;padding-right:6%}}@media(max-width:520px){.gallery{columns:1}.brand img{width:38px}.lightbox{padding:70px 25px}.prev,.next{bottom:15px;top:auto}.prev{left:15px}.next{right:15px}nav a:nth-child(2){display:none}}</style></head><body>

<script>
const photos=[{"file":"1718309028203.jpg","category":"molds"},{"file":"IMG_8395.jpg","category":"molds"},{"file":"IMG_8425.jpg","category":"molds"},{"file":"IMG_8436.jpg","category":"molds"},{"file":"IMG_8444.jpg","category":"molds"},{"file":"IMG_8460.jpg","category":"molds"},{"file":"IMG_8472.jpg","category":"molds"},{"file":"IMG_8486.jpg","category":"molds"},{"file":"IMG_8495.jpg","category":"molds"},{"file":"IMG_8508.jpg","category":"molds"},{"file":"Untitled-1.jpg","category":"culinary"},{"file":"chips.jpg","category":"culinary"},{"file":"chipsa2.jpg","category":"culinary"},{"file":"fish.jpg","category":"culinary"},{"file":"goroh.jpg","category":"culinary"},{"file":"meat.jpg","category":"culinary"},{"file":"polusfera.jpg","category":"molds"}];
const dict={en:{home:"HOME",gallery:"GALLERY",recognition:"RECOGNITION",eyebrow:"SELECTED WORKS · WILLE ENVISIONS",title:"The gallery.",intro:"Explore the shapes, textures and culinary possibilities behind our bespoke creations.",all:"ALL WORK",molds:"SILICONE MOLDS",culinary:"CULINARY CREATIONS",contact:"DISCUSS YOUR PROJECT ↗"},et:{home:"AVALEHT",gallery:"GALERII",recognition:"TUNNUSTUS",eyebrow:"VALITUD TÖÖD · WILLE ENVISIONS",title:"Galerii.",intro:"Avasta meie eritellimusel loodud vorme, tekstuure ja kulinaarseid võimalusi.",all:"KÕIK TÖÖD",molds:"SILIKOONVORMID",culinary:"KULINAARNE LOOMING",contact:"RÄÄGIME SINU PROJEKTIST ↗"},ru:{home:"ГЛАВНАЯ",gallery:"ГАЛЕРЕЯ",recognition:"ПРИЗНАНИЕ",eyebrow:"ИЗБРАННЫЕ РАБОТЫ · WILLE ENVISIONS",title:"Галерея.",intro:"Формы, текстуры и гастрономические возможности наших индивидуальных проектов.",all:"ВСЕ РАБОТЫ",molds:"СИЛИКОНОВЫЕ ФОРМЫ",culinary:"КУЛИНАРНЫЕ РАБОТЫ",contact:"ОБСУДИТЬ ПРОЕКТ ↗"}};
let filtered=photos.slice(),current=0,lastFocus=null;const gallery=document.getElementById("gallery"),lb=document.getElementById("lightbox");function render(){gallery.replaceChildren();filtered.forEach((p,i)=>{const fig=document.createElement("figure");fig.className="tile";fig.tabIndex=0;fig.setAttribute("role","button");fig.setAttribute("aria-label","View photo "+(i+1));const img=document.createElement("img");img.src=p.file;img.alt="Wille Envisions — "+p.category+" photograph "+(i+1);img.loading="lazy";const cap=document.createElement("figcaption");cap.textContent="WILLE ENVISIONS · "+String(i+1).padStart(2,"0");fig.append(img,cap);fig.onclick=()=>open(i);fig.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(i)}};gallery.append(fig)})}function open(i){lastFocus=document.activeElement;current=i;update();lb.classList.add("open");document.body.style.overflow="hidden";document.getElementById("close").focus()}function update(){document.getElementById("large").src=filtered[current].file;document.getElementById("large").alt="Wille Envisions gallery image "+(current+1);document.getElementById("count").textContent=(current+1)+" / "+filtered.length}function close(){lb.classList.remove("open");document.body.style.overflow="";lastFocus?.focus()}function step(n){current=(current+n+filtered.length)%filtered.length;update()}document.getElementById("close").onclick=close;document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);lb.addEventListener("click",e=>{if(e.target===lb)close()});document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);if(e.key==="Tab"){const buttons=[...lb.querySelectorAll("button")];const idx=buttons.indexOf(document.activeElement);if(e.shiftKey&&idx===0){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&idx===buttons.length-1){e.preventDefault();buttons[0].focus()}}});document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelector(".filters .active")?.classList.remove("active");b.classList.add("active");filtered=photos.filter(p=>b.dataset.filter==="all"||p.category===b.dataset.filter);render()});document.getElementById("lang").onchange=e=>{let l=e.target.value;document.documentElement.lang=l;document.querySelectorAll("[data-t]").forEach(n=>n.textContent=dict[l][n.dataset.t])};render();
</script></body></html>
